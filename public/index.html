<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeiScheduler 定时任务</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div class="hero-copy-block">
          <p class="eyebrow">WeiScheduler</p>
          <h1>尉Python 定时任务</h1>
          <p class="hero-copy">
            选择指定 Python 环境、脚本路径与 Cron 时间表达式，在网页中创建和运行调度任务。
          </p>
          <div class="hero-stats">
            <div class="hero-stat">
              <div class="hero-stat-icon total">📋</div>
              <div class="hero-stat-body">
                <span class="hero-stat-label">总任务</span>
                <strong id="hero-total">0</strong>
              </div>
            </div>
            <div class="hero-stat">
              <div class="hero-stat-icon running">▶</div>
              <div class="hero-stat-body">
                <span class="hero-stat-label">运行中</span>
                <strong id="hero-running">0</strong>
              </div>
            </div>
            <div class="hero-stat">
              <div class="hero-stat-icon enabled">⚙</div>
              <div class="hero-stat-body">
                <span class="hero-stat-label">已启用</span>
                <strong id="hero-enabled">0</strong>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="layout">
        <section class="panel panel-form">
          <div class="section-head">
            <h2 id="form-title">新建任务</h2>
            <button id="reset-form" class="ghost-button" type="button">清空</button>
          </div>

          <form id="task-form" class="task-form">
            <input type="hidden" id="task-id" name="id" />

            <div class="form-section">
              <h3 class="form-section-title">基本信息</h3>

              <label>
                任务名称
                <input id="name" name="name" placeholder="例如：日报生成" required />
              </label>

              <label>
                脚本路径
                <input
                  id="scriptPath"
                  name="scriptPath"
                  placeholder="例如：D:\jobs\report.py"
                  required
                />
              </label>

              <label>
                启动参数
                <input id="args" name="args" placeholder='例如：--date "2026-03-19"' />
              </label>

              <label>
                工作目录
                <input id="workingDirectory" name="workingDirectory" placeholder="可选，默认脚本所在目录" />
              </label>
            </div>

            <div class="form-section">
              <h3 class="form-section-title">执行配置</h3>

              <label>
                执行方式
                <select id="runnerType" name="runnerType">
                  <option value="python">直接调用 Python</option>
                  <option value="conda-name">Conda 环境名</option>
                  <option value="conda-path">Conda 环境路径</option>
                </select>
              </label>

              <label id="command-path-row">
                <span class="field-label">Python 路径</span>
                <input
                  id="commandPath"
                  name="commandPath"
                  placeholder="例如：D:\ProgramData\miniconda3\envs\py3143\python.exe"
                />
              </label>

              <label id="conda-target-row">
                Conda 环境名或路径
                <input
                  id="condaTarget"
                  name="condaTarget"
                  placeholder="环境名如 myenv，或环境路径如 D:\miniconda3\envs\myenv"
                />
              </label>

              <label>
                时间参数名
                <input id="timeArgName" name="timeArgName" placeholder="例如：--run-time" />
              </label>

              <label>
                时间参数值
                <input id="timeArgValue" name="timeArgValue" type="datetime-local" />
              </label>
            </div>

            <div class="form-section">
              <h3 class="form-section-title">调度配置</h3>

              <label>
                Cron 时间表达式
                <input id="schedule" name="schedule" placeholder="例如：*/10 * * * *" required />

                <!-- Mode toggle -->
                <div class="cron-mode-tabs">
                  <button class="cron-mode-tab active" type="button" data-mode="simple">齿轮滑块</button>
                  <button class="cron-mode-tab" type="button" data-mode="advanced">高级编辑</button>
                </div>

                <!-- Simple mode: visual gear/slider UI -->
                <div id="cron-simple" class="cron-simple">
                  <!-- Frequency tabs -->
                  <div class="cron-freq-tabs">
                    <button class="cron-freq-tab active" type="button" data-freq="every-n-minutes">每 N 分钟</button>
                    <button class="cron-freq-tab" type="button" data-freq="hourly">每小时</button>
                    <button class="cron-freq-tab" type="button" data-freq="daily">每天</button>
                    <button class="cron-freq-tab" type="button" data-freq="weekly">每周</button>
                    <button class="cron-freq-tab" type="button" data-freq="monthly">每月</button>
                  </div>

                  <!-- Panel: every N minutes -->
                  <div class="cron-panel" data-panel="every-n-minutes">
                    <div class="cron-slider-row">
                      <span class="cron-slider-label">每隔</span>
                      <input type="range" id="cron-slider-every-n" class="cron-slider" min="1" max="59" value="5" />
                      <span class="cron-slider-value">
                        <strong id="cron-every-n-display">5</strong> 分钟执行一次
                      </span>
                    </div>
                  </div>

                  <!-- Panel: hourly -->
                  <div class="cron-panel hidden" data-panel="hourly">
                    <div class="cron-slider-row">
                      <span class="cron-slider-label">在第</span>
                      <input type="range" id="cron-slider-hourly" class="cron-slider" min="0" max="59" value="0" />
                      <span class="cron-slider-value">
                        <strong id="cron-hourly-display">0</strong> 分钟执行
                      </span>
                    </div>
                  </div>

                  <!-- Panel: daily -->
                  <div class="cron-panel hidden" data-panel="daily">
                    <div class="cron-time-row">
                      <span class="cron-slider-label">在</span>
                      <input type="time" id="cron-daily-time" class="cron-time-input" value="09:00" />
                      <span class="cron-slider-value">执行</span>
                    </div>
                  </div>

                  <!-- Panel: weekly -->
                  <div class="cron-panel hidden" data-panel="weekly">
                    <div class="cron-weekday-row">
                      <span class="cron-slider-label">在</span>
                      <div class="cron-weekday-grid" id="cron-weekday-grid">
                        <label class="cron-weekday-btn" data-day="1"><input type="checkbox" /><span>一</span></label>
                        <label class="cron-weekday-btn" data-day="2"><input type="checkbox" /><span>二</span></label>
                        <label class="cron-weekday-btn" data-day="3"><input type="checkbox" /><span>三</span></label>
                        <label class="cron-weekday-btn" data-day="4"><input type="checkbox" /><span>四</span></label>
                        <label class="cron-weekday-btn" data-day="5"><input type="checkbox" /><span>五</span></label>
                        <label class="cron-weekday-btn" data-day="6"><input type="checkbox" /><span>六</span></label>
                        <label class="cron-weekday-btn" data-day="0"><input type="checkbox" /><span>日</span></label>
                      </div>
                    </div>
                    <div class="cron-time-row" style="margin-top:10px">
                      <span class="cron-slider-label">在</span>
                      <input type="time" id="cron-weekly-time" class="cron-time-input" value="09:00" />
                      <span class="cron-slider-value">执行</span>
                    </div>
                  </div>

                  <!-- Panel: monthly -->
                  <div class="cron-panel hidden" data-panel="monthly">
                    <div class="cron-slider-row">
                      <span class="cron-slider-label">在第</span>
                      <input type="range" id="cron-slider-monthly" class="cron-slider" min="1" max="31" value="1" />
                      <span class="cron-slider-value">
                        <strong id="cron-monthly-display">1</strong> 日
                      </span>
                    </div>
                    <div class="cron-time-row" style="margin-top:10px">
                      <span class="cron-slider-label">在</span>
                      <input type="time" id="cron-monthly-time" class="cron-time-input" value="09:00" />
                      <span class="cron-slider-value">执行</span>
                    </div>
                  </div>
                </div>

                <!-- Advanced mode: 5-field builder + presets -->
                <div id="cron-advanced" class="cron-advanced hidden">
                  <div class="cron-builder">
                    <div class="cron-builder-grid">
                      <label>
                        分钟
                        <input id="cron-minute" placeholder="* / */10 / 0,30" />
                      </label>
                      <label>
                        小时
                        <input id="cron-hour" placeholder="* / 9 / 9-18" />
                      </label>
                      <label>
                        日
                        <input id="cron-day" placeholder="* / 1 / 1-5" />
                      </label>
                      <label>
                        月
                        <input id="cron-month" placeholder="* / 1 / 1,6,12" />
                      </label>
                      <label>
                        周
                        <input id="cron-weekday" placeholder="* / 1-5 / 0,6" />
                      </label>
                    </div>
                    <span class="field-help">支持 `*`、`*/10`、`1,15,30`、`1-5` 等 Cron 写法。留空按 `*` 处理。</span>
                  </div>
                  <div class="cron-presets">
                    <button class="ghost-button cron-preset" type="button" data-cron="*/5 * * * *">每 5 分钟</button>
                    <button class="ghost-button cron-preset" type="button" data-cron="0 * * * *">每小时</button>
                    <button class="ghost-button cron-preset" type="button" data-cron="0 */3 * * *">每 3 小时</button>
                    <button class="ghost-button cron-preset" type="button" data-cron="0 */6 * * *">每 6 小时</button>
                    <button class="ghost-button cron-preset" type="button" data-cron="0 9 * * *">每天 09:00</button>
                    <button class="ghost-button cron-preset" type="button" data-cron="0 0 */3 * *">每 3 天</button>
                    <button class="ghost-button cron-preset" type="button" data-cron="0 9 * * 1-5">工作日 09:00</button>
                    <button class="ghost-button cron-preset" type="button" data-cron="0 0 1 * *">每月 1 日</button>
                  </div>
                </div>

                <span class="field-help">齿轮滑块模式下自动生成表达式。也可切换高级模式手动编辑。</span>
              </label>

              <label class="checkbox-row">
                <input id="enabled" name="enabled" type="checkbox" checked />
                <span>启用调度</span>
              </label>
            </div>

            <button class="primary-button" type="submit">保存任务</button>
          </form>
        </section>

        <section class="panel panel-list">
          <div class="section-head">
            <h2>任务列表</h2>
            <div class="toolbar-actions">
              <label class="auto-refresh-toggle">
                <input id="auto-refresh-enabled" type="checkbox" checked />
                自动刷新
              </label>
              <select id="auto-refresh-interval" class="toolbar-select">
                <option value="5000">5 秒</option>
                <option value="10000" selected>10 秒</option>
                <option value="30000">30 秒</option>
              </select>
              <input id="import-file" type="file" accept="application/json" hidden />
              <button id="import-tasks" class="ghost-button" type="button">导入</button>
              <button id="export-tasks" class="ghost-button" type="button">导出</button>
              <button id="refresh-list" class="ghost-button" type="button">刷新</button>
            </div>
          </div>
          <div id="task-list" class="task-list"></div>
        </section>
      </main>
    </div>

    <template id="task-template">
      <article class="task-card">
        <div class="task-card-head">
          <div class="task-title-group">
            <div class="task-title-row">
              <h3 class="task-name"></h3>
              <span class="task-frequency"></span>
            </div>
            <p class="task-meta"></p>
          </div>
          <div class="task-card-tools">
            <div class="task-quick-actions">
              <button class="ghost-button action-start" type="button">启动</button>
              <button class="ghost-button action-pause" type="button">暂停</button>
              <button class="ghost-button danger action-stop-head" type="button">终止</button>
              <button class="ghost-button action-run-once" type="button">立即执行1次</button>
            </div>
            <button class="ghost-button action-toggle" type="button">折叠详情</button>
            <span class="task-status"></span>
          </div>
        </div>
        <div class="task-body">
          <dl class="task-detail"></dl>
          <div class="task-actions">
            <button class="ghost-button action-edit" type="button">编辑</button>
            <button class="ghost-button action-run" type="button">立即执行</button>
            <button class="ghost-button action-clear-logs" type="button">清除日志</button>
            <button class="ghost-button danger action-stop" type="button">终止任务</button>
            <button class="ghost-button danger action-delete" type="button">删除</button>
          </div>
          <div class="log-block">
            <h4>最近日志</h4>
            <pre class="task-log">暂无运行记录</pre>
          </div>
        </div>
      </article>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
