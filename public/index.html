<!DOCTYPE html>
<html lang="zh-CN" data-theme="zhenji">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeiScheduler 定时任务</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- 🎨 装饰元素（每个皮肤自定义呈现） -->
    <div class="deco-orb deco-orb--1" aria-hidden="true"></div>
    <div class="deco-orb deco-orb--2" aria-hidden="true"></div>
    <div class="deco-orb deco-orb--3" aria-hidden="true"></div>
    <div class="deco-orb deco-orb--4" aria-hidden="true"></div>

    <div class="app-shell">
      <!-- ─── Hero: Compact stats dashboard ─── -->
      <header class="hero">
        <div class="hero-inner">
          <div class="hero-brand">
            <h1 class="hero-title">尉定时任务</h1>
            <p class="hero-tagline">选择 Python 环境与 Cron 表达式，轻松调度脚本执行</p>
          </div>
          <div class="hero-stats">
            <div class="stat-chip">
              <span class="stat-icon stat-icon--total" aria-hidden="true">📋</span>
              <span class="stat-body">
                <span class="stat-value" id="hero-total">0</span>
                <span class="stat-label">总任务</span>
              </span>
            </div>
            <div class="stat-chip">
              <span class="stat-icon stat-icon--running" aria-hidden="true">▶</span>
              <span class="stat-body">
                <span class="stat-value" id="hero-running">0</span>
                <span class="stat-label">运行中</span>
              </span>
            </div>
            <div class="stat-chip">
              <span class="stat-icon stat-icon--enabled" aria-hidden="true">⚙</span>
              <span class="stat-body">
                <span class="stat-value" id="hero-enabled">0</span>
                <span class="stat-label">已启用</span>
              </span>
            </div>
          </div>
        </div>
      </header>

      <!-- ─── Main Layout ─── -->
      <div class="layout">
        <!-- ─── Left: Form panel ─── -->
        <aside class="panel panel-form" aria-label="任务编辑">
          <div class="panel-header">
            <h2 id="form-title" class="panel-title">新建任务</h2>
            <button id="reset-form" class="btn btn--ghost btn--sm" type="button">清空</button>
          </div>

          <form id="task-form" class="task-form" novalidate>
            <input type="hidden" id="task-id" name="id" />

            <fieldset class="fieldset">
              <legend class="fieldset-legend">基本信息</legend>
              <div class="field">
                <label class="field-label" for="name">任务名称</label>
                <input id="name" name="name" class="input" placeholder="例如：日报生成" required />
              </div>
              <div class="field">
                <label class="field-label" for="scriptPath">脚本路径</label>
                <input id="scriptPath" name="scriptPath" class="input" placeholder="例如：D:\jobs\report.py" required />
              </div>
              <div class="field-row">
                <div class="field flex-1">
                  <label class="field-label" for="args">启动参数</label>
                  <input id="args" name="args" class="input" placeholder='--date "2026-03-19"' />
                </div>
                <div class="field flex-1">
                  <label class="field-label" for="workingDirectory">工作目录</label>
                  <input id="workingDirectory" name="workingDirectory" class="input" placeholder="默认脚本所在目录" />
                </div>
              </div>
            </fieldset>

            <fieldset class="fieldset">
              <legend class="fieldset-legend">执行配置</legend>
              <div class="field">
                <label class="field-label" for="runnerType">执行方式</label>
                <select id="runnerType" name="runnerType" class="input">
                  <option value="python">直接调用 Python</option>
                  <option value="conda-name">Conda 环境名</option>
                  <option value="conda-path">Conda 环境路径</option>
                </select>
              </div>
              <div id="command-path-row" class="field">
                <label class="field-label" id="command-path-label">Python 路径</label>
                <input id="commandPath" name="commandPath" class="input" placeholder="例如：D:\miniconda3\envs\py3143\python.exe" />
              </div>
              <div id="conda-target-row" class="field" style="display:none">
                <label class="field-label" for="condaTarget">Conda 环境名或路径</label>
                <input id="condaTarget" name="condaTarget" class="input" placeholder="环境名如 myenv，或完整路径" />
              </div>
              <div class="field-row">
                <div class="field flex-1">
                  <label class="field-label" for="timeArgName">时间参数名</label>
                  <input id="timeArgName" name="timeArgName" class="input" placeholder="例如：--run-time" />
                </div>
                <div class="field flex-1">
                  <label class="field-label" for="timeArgValue">时间参数值</label>
                  <input id="timeArgValue" name="timeArgValue" class="input" type="datetime-local" />
                </div>
              </div>
            </fieldset>

            <fieldset class="fieldset">
              <legend class="fieldset-legend">调度配置</legend>
              <div class="field">
                <label class="field-label" for="schedule">Cron 表达式</label>
                <input id="schedule" name="schedule" class="input" placeholder="*/10 * * * *" required />

                <!-- Mode toggle -->
                <div class="cron-mode-tabs" role="tablist">
                  <button class="cron-mode-tab active" type="button" data-mode="simple" role="tab" aria-selected="true">齿轮滑块</button>
                  <button class="cron-mode-tab" type="button" data-mode="advanced" role="tab" aria-selected="false">高级编辑</button>
                </div>

                <!-- Simple mode -->
                <div id="cron-simple" class="cron-simple">
                  <div class="cron-freq-tabs">
                    <button class="cron-freq-tab active" type="button" data-freq="every-n-minutes">每 N 分钟</button>
                    <button class="cron-freq-tab" type="button" data-freq="hourly">每小时</button>
                    <button class="cron-freq-tab" type="button" data-freq="daily">每天</button>
                    <button class="cron-freq-tab" type="button" data-freq="weekly">每周</button>
                    <button class="cron-freq-tab" type="button" data-freq="monthly">每月</button>
                  </div>

                  <div class="cron-panel" data-panel="every-n-minutes">
                    <div class="cron-slider-row">
                      <span class="cron-slider-label">每隔</span>
                      <input type="range" id="cron-slider-every-n" class="cron-slider" min="1" max="59" value="5" />
                      <span class="cron-slider-value"><strong id="cron-every-n-display">5</strong> 分钟</span>
                    </div>
                  </div>

                  <div class="cron-panel hidden" data-panel="hourly">
                    <div class="cron-slider-row">
                      <span class="cron-slider-label">在第</span>
                      <input type="range" id="cron-slider-hourly" class="cron-slider" min="0" max="59" value="0" />
                      <span class="cron-slider-value"><strong id="cron-hourly-display">0</strong> 分执行</span>
                    </div>
                  </div>

                  <div class="cron-panel hidden" data-panel="daily">
                    <div class="cron-slider-row">
                      <span class="cron-slider-label">在</span>
                      <input type="time" id="cron-daily-time" class="cron-time-input" value="09:00" />
                      <span class="cron-slider-value">执行</span>
                    </div>
                  </div>

                  <div class="cron-panel hidden" data-panel="weekly">
                    <div class="cron-slider-row">
                      <span class="cron-slider-label">在</span>
                      <div class="cron-weekday-grid" id="cron-weekday-grid">
                        <label class="cron-weekday-btn" data-day="1"><input type="checkbox" /><span>一</span></label>
                        <label class="cron-weekday-btn" data-day="2"><input type="checkbox" /><span>二</span></label>
                        <label class="cron-weekday-btn" data-day="3"><input type="checkbox" /><span>三</span></label>
                        <label class="cron-weekday-btn" data-day="4"><input type="checkbox" /><span>四</span></label>
                        <label class="cron-weekday-btn" data-day="5"><input type="checkbox" /><span>五</span></label>
                        <label class="cron-weekday-btn" data-day="6"><input type="checkbox" /><span>六</span></label>
                        <label class="cron-weekday-btn" data-day="0"><input type="checkbox" /><span>日</span></label>
                      </div>
                      <input type="time" id="cron-weekly-time" class="cron-time-input" value="09:00" />
                    </div>
                  </div>

                  <div class="cron-panel hidden" data-panel="monthly">
                    <div class="cron-slider-row">
                      <span class="cron-slider-label">在第</span>
                      <input type="range" id="cron-slider-monthly" class="cron-slider" min="1" max="31" value="1" />
                      <span class="cron-slider-value"><strong id="cron-monthly-display">1</strong> 日</span>
                    </div>
                    <div class="cron-slider-row" style="margin-top:8px">
                      <span class="cron-slider-label">在</span>
                      <input type="time" id="cron-monthly-time" class="cron-time-input" value="09:00" />
                    </div>
                  </div>
                </div>

                <!-- Advanced mode -->
                <div id="cron-advanced" class="cron-advanced hidden">
                  <div class="cron-builder-grid">
                    <div class="cron-builder-field">
                      <label class="field-label" for="cron-minute">分钟</label>
                      <input id="cron-minute" class="input" placeholder="* / */10 / 0,30" />
                    </div>
                    <div class="cron-builder-field">
                      <label class="field-label" for="cron-hour">小时</label>
                      <input id="cron-hour" class="input" placeholder="* / 9 / 9-18" />
                    </div>
                    <div class="cron-builder-field">
                      <label class="field-label" for="cron-day">日</label>
                      <input id="cron-day" class="input" placeholder="* / 1 / 1-5" />
                    </div>
                    <div class="cron-builder-field">
                      <label class="field-label" for="cron-month">月</label>
                      <input id="cron-month" class="input" placeholder="* / 1 / 1,6,12" />
                    </div>
                    <div class="cron-builder-field">
                      <label class="field-label" for="cron-weekday">周</label>
                      <input id="cron-weekday" class="input" placeholder="* / 1-5 / 0,6" />
                    </div>
                  </div>
                  <p class="field-hint">支持 <code>*</code>、<code>*/10</code>、<code>1,15,30</code>、<code>1-5</code> 等写法</p>
                  <div class="cron-presets">
                    <button class="btn btn--chip" type="button" data-cron="*/5 * * * *">每 5 分</button>
                    <button class="btn btn--chip" type="button" data-cron="0 * * * *">每小时</button>
                    <button class="btn btn--chip" type="button" data-cron="0 */3 * * *">每 3 小时</button>
                    <button class="btn btn--chip" type="button" data-cron="0 */6 * * *">每 6 小时</button>
                    <button class="btn btn--chip" type="button" data-cron="0 9 * * *">每天 09:00</button>
                    <button class="btn btn--chip" type="button" data-cron="0 0 */3 * *">每 3 天</button>
                    <button class="btn btn--chip" type="button" data-cron="0 9 * * 1-5">工作日</button>
                    <button class="btn btn--chip" type="button" data-cron="0 0 1 * *">每月 1 日</button>
                  </div>
                </div>

                <p class="field-hint">滑块模式自动生成，也可切换高级模式手动编辑</p>
              </div>

              <label class="checkbox-field">
                <input id="enabled" name="enabled" type="checkbox" checked />
                <span>启用调度</span>
              </label>
            </fieldset>

            <div class="form-actions">
              <button class="btn btn--primary" type="submit">保存任务</button>
            </div>
          </form>
        </aside>

        <!-- ─── Right: Task list panel ─── -->
        <main class="panel panel-list">
          <div class="panel-header">
            <h2 class="panel-title">任务列表</h2>
            <div class="toolbar">
              <label class="toolbar-toggle">
                <input id="auto-refresh-enabled" type="checkbox" checked />
                <span>自动刷新</span>
              </label>
              <select id="auto-refresh-interval" class="toolbar-select">
                <option value="5000">5 秒</option>
                <option value="10000" selected>10 秒</option>
                <option value="30000">30 秒</option>
              </select>
              <input id="import-file" type="file" accept="application/json" hidden />
              <button id="import-tasks" class="btn btn--ghost btn--sm" type="button" title="导入任务">导入</button>
              <button id="export-tasks" class="btn btn--ghost btn--sm" type="button" title="导出任务">导出</button>
              <button id="refresh-list" class="btn btn--ghost btn--sm" type="button" title="刷新列表">↻</button>
            </div>
          </div>
          <div id="task-list" class="task-list"></div>
        </main>
      </div>
    </div>

    <!-- ─── Task Card Template ─── -->
    <template id="task-template">
      <article class="task-card">
        <div class="task-card__head">
          <div class="task-card__title-group">
            <span class="task-status-badge" data-status="never">未运行</span>
            <h3 class="task-card__name"></h3>
            <span class="task-frequency"></span>
          </div>
          <div class="task-card__quick-actions">
            <button class="btn btn--icon action-start" type="button" title="启动调度">▶</button>
            <button class="btn btn--icon action-pause" type="button" title="暂停调度">⏸</button>
            <button class="btn btn--icon action-run-once" type="button" title="立即执行一次">⏩</button>
            <button class="btn btn--icon btn--danger action-stop-head" type="button" title="终止运行">⏹</button>
          </div>
        </div>

        <div class="task-card__meta">
          <span class="task-meta-line"><span class="meta-label">调度</span><span class="meta-schedule"></span></span>
          <span class="task-meta-line"><span class="meta-label">上次</span><span class="meta-last-run">-</span></span>
          <span class="task-meta-line"><span class="meta-label">下次</span><span class="meta-next-run">-</span></span>
        </div>

        <div class="task-card__body">
          <div class="task-card__detail">
            <dl class="detail-grid"></dl>
          </div>
          <div class="task-card__error" style="display:none"></div>
          <div class="task-card__log">
            <div class="log-header">
              <span class="log-title">最近日志</span>
              <button class="btn btn--ghost btn--xs action-clear-logs" type="button">清除</button>
            </div>
            <pre class="log-content">暂无运行记录</pre>
          </div>
          <div class="task-card__actions">
            <button class="btn btn--ghost action-edit" type="button">编辑</button>
            <button class="btn btn--ghost action-run" type="button">立即执行</button>
            <button class="btn btn--ghost btn--danger action-stop" type="button">终止</button>
            <button class="btn btn--ghost btn--danger action-delete" type="button">删除</button>
          </div>
        </div>

        <button class="task-card__toggle" type="button" aria-label="展开/折叠详情">
          <span class="toggle-text">展开详情</span>
          <span class="toggle-arrow" aria-hidden="true">▾</span>
        </button>
      </article>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
